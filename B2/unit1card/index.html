        // ================================================================
        //  难度递增：动态分配每关词条数（4~10，逐步递增）
        // ================================================================
        function generateLevelWordCounts(totalWords, min = 4, max = 10) {
            let n = Math.ceil(totalWords / ((min + max) / 2));
            n = Math.max(n, 1);
            let counts = [];
            let sum = 0;
            for (let i = 1; i <= n; i++) {
                let count = Math.round(min + (i - 1) * (max - min) / (n - 1));
                count = Math.min(max, Math.max(min, count));
                counts.push(count);
                sum += count;
            }
            let diff = totalWords - sum;
            for (let i = n - 1; i >= 0 && diff !== 0; i--) {
                if (diff > 0) {
                    let add = Math.min(diff, max - counts[i]);
                    counts[i] += add;
                    diff -= add;
                } else {
                    let sub = Math.min(-diff, counts[i] - min);
                    counts[i] -= sub;
                    diff += sub;
                }
            }
            for (let i = 1; i < counts.length; i++) {
                if (counts[i] < counts[i - 1]) {
                    let diff2 = counts[i - 1] - counts[i];
                    for (let j = i; j < counts.length; j++) {
                        if (diff2 <= 0) break;
                        let can = Math.min(diff2, counts[j] - min);
                        counts[j] -= can;
                        diff2 -= can;
                    }
                    counts[i] += (counts[i - 1] - counts[i]);
                }
            }
            let sum2 = counts.reduce((a, b) => a + b, 0);
            if (sum2 !== totalWords) {
                let lastIdx = counts.length - 1;
                let diff3 = totalWords - sum2;
                if (diff3 > 0) {
                    let add = Math.min(diff3, max - counts[lastIdx]);
                    counts[lastIdx] += add;
                } else {
                    let sub = Math.min(-diff3, counts[lastIdx] - min);
                    counts[lastIdx] -= sub;
                }
            }
            return counts;
        }

                try {

                    masterGain.gain.setValueAtTime(0.7, this.audioContext.currentTime);

                    const oscillator1 = this.audioContext.createOscillator();
                    const oscillator2 = this.audioContext.createOscillator();

                    utterance.rate = 0.8;

                    setTimeout(() => { window.speechSynthesis.speak(utterance); }, 50);

            levelSelectBtn: document.getElementById('level-select-btn'),
            closeLevelSelect: document.getElementById('close-level-select'),
            closeLevelSelectBtn: document.getElementById('close-level-select-btn'),
            pauseBtn: document.getElementById('pause-btn'),
            resumeBtn: document.getElementById('resume-btn'),
            quitBtn: document.getElementById('quit-btn'),
            playAgainBtn: document.getElementById('play-again-btn'),
            clearPlayAgain: document.getElementById('clear-play-again'),
            clearMainMenu: document.getElementById('clear-main-menu')
        };

        // ================================================================
        //  辅助函数
        // ================================================================
        function getPairCountForLevel(level) {
            return levelWordCounts[level - 1] || 0;
        }

        function getStartIndexForLevel(level) {
            let idx = 0;
            for (let i = 0; i < level - 1; i++) {
                idx += levelWordCounts[i];
            }
            return idx;
        }

        // ================================================================
        //  ⏱️ 自定义关卡时间（第11关单独设为35秒）
        // ================================================================
        function getTimeForLevel(level) {
            if (level === 11) return 35;
            const total = gameState.totalLevels;
            if (total <= 5) return 30;
            if (level <= Math.ceil(total * 0.3)) return 35;
            if (level <= Math.ceil(total * 0.6)) return 30;
            if (level <= Math.ceil(total * 0.85)) return 25;
            return 20;
        }

        // ================================================================
        //  游戏核心逻辑
        // ================================================================

        elements.startBtn.addEventListener('click', startGame);
        elements.restartBtn.addEventListener('click', restartGame);
        elements.levelSelectBtn.addEventListener('click', showLevelSelect);
        elements.closeLevelSelect.addEventListener('click', hideLevelSelect);
        elements.closeLevelSelectBtn.addEventListener('click', hideLevelSelect);
        elements.pauseBtn.addEventListener('click', pauseGame);
        elements.resumeBtn.addEventListener('click', resumeGame);
        elements.quitBtn.addEventListener('click', quitGame);
        elements.playAgainBtn.addEventListener('click', restartGame);
        elements.clearPlayAgain.addEventListener('click', restartGame);
        elements.clearMainMenu.addEventListener('click', quitGame);

        // ----- 选关按钮生成（根据解锁状态） -----
        function generateLevelButtons() {
            elements.levelList.innerHTML = '';
            for (let i = 1; i <= gameState.totalLevels; i++) {
                const levelBtn = document.createElement('button');
                const isUnlocked = i <= gameState.unlockedLevel;
                const isCurrent = i === gameState.level;

                // 基础样式
                levelBtn.className = `level-btn`;
                if (isUnlocked) {
                    levelBtn.classList.add('unlocked');
                    if (isCurrent) levelBtn.classList.add('current');
                } else {
                    levelBtn.classList.add('locked');
                }

                levelBtn.textContent = i;
                levelBtn.dataset.level = i;

                // 只有已解锁的才绑定点击事件
                if (isUnlocked) {
                    levelBtn.addEventListener('click', function() {
                        const level = parseInt(this.dataset.level);
                        selectLevel(level);
                    });
                    levelBtn.addEventListener('mouseenter', function() {
                        if (parseInt(this.dataset.level) !== gameState.level) {
                            this.classList.add('scale-105');
                        }
                    });
                    levelBtn.addEventListener('mouseleave', function() {
                        this.classList.remove('scale-105');
                    });
                } else {
                    // 未解锁的添加 title 提示
                    levelBtn.title = '未解锁，请先通关前一关';
                }

                elements.levelList.appendChild(levelBtn);
            }
        }

        function selectLevel(level) {
            // 检查是否已解锁
            if (level > gameState.unlockedLevel) {
                alert('该关卡尚未解锁，请先通关前面的关卡！');
                return;
            }
            if (level === gameState.level) {
                hideLevelSelect();
                return;
            }

            elements.levelSelectScreen.classList.add('hidden');
            elements.levelSelectScreen.classList.remove('animate-slide-down', 'animate-slide-up');

            if (gameState.timer) clearInterval(gameState.timer);

            // 重置当前进度到所选关卡，但保留得分（可选），这里保持得分不清零，但通关后才会结算
            // 为了公平，跳关后得分归零？（根据需求，我们让得分保留，但也可以重置，这里选择重置得分和关卡进度）
            // 但用户希望逐关完成，跳关可能影响成就，我们保持得分清零，从新关卡开始。
            gameState.score = 0;
            gameState.level = level;
            gameState.timeLeft = getTimeForLevel(level);
            gameState.matchedPairs = 0;
            gameState.selectedBubble = null;
            gameState.isPaused = false;
            gameState.isGameOver = false;
            gameState.isCleared = false;
            gameState.previousWords = { all: [] };
            gameState.currentWordIndex = getStartIndexForLevel(level);

            updateScore();
            updateLevel();
            updateTimeLeft();
            elements.timeProgress.style.width = '100%';

            document.querySelectorAll('.bubble-selected').forEach(b => b.classList.remove('bubble-selected'));

            generateLevel();
            startTimer();

            elements.levelDisplay.classList.add('scale-125', 'text-accent');
            setTimeout(() => {
                elements.levelDisplay.classList.remove('scale-125', 'text-accent');
            }, 300);

            elements.gameArea.classList.remove('hidden');
            elements.startScreen.classList.add('hidden');
            elements.gameOver.classList.add('hidden');
            elements.clearScreen.classList.add('hidden');
            elements.pauseScreen.classList.add('hidden');
        }

        function showLevelSelect() {
            gameState.isLevelSelectPause = true;
            pauseGame();
            gameState.isLevelSelectPause = false;
            audioManager.playSelectLevelSound();
            elements.levelSelectScreen.classList.remove('hidden');
            elements.levelSelectScreen.classList.remove('animate-slide-up');
            elements.levelSelectScreen.classList.add('animate-slide-down');
            generateLevelButtons(); // 每次打开刷新状态
        }

        function hideLevelSelect() {
            audioManager.playClickSound();
            elements.levelSelectScreen.classList.remove('animate-slide-down');
            elements.levelSelectScreen.classList.add('animate-slide-up');
            setTimeout(() => {
                elements.levelSelectScreen.classList.add('hidden');
                elements.levelSelectScreen.classList.remove('animate-slide-up');
                if (!gameState.isGameOver && !gameState.isCleared) {
                    resumeGame();
                }
            }, 300);
        }

        function startGame() {
            audioManager.init();
            elements.startScreen.classList.add('hidden');
            elements.gameArea.classList.remove('hidden');
            elements.clearScreen.classList.add('hidden');
            audioManager.playStartSound();
            resetGameState();
            generateLevel();
            startTimer();
        }

        function resetGameState() {
            gameState.score = 0;
            gameState.level = 1;
            gameState.timeLeft = getTimeForLevel(1);
            gameState.matchedPairs = 0;
            gameState.selectedBubble = null;
            gameState.isGameOver = false;
            gameState.isCleared = false;
            gameState.usedWordCount = 0;
            gameState.isLevelSelectPause = false;
            gameState.previousWords = { all: [] };
            gameState.currentWordIndex = getStartIndexForLevel(1);
            // 重置解锁状态
            gameState.unlockedLevel = 1;

            if (gameState.fireworkInterval) {
                clearInterval(gameState.fireworkInterval);
                gameState.fireworkInterval = null;
            }
            document.querySelectorAll('.firework, .firework-trail').forEach(el => el.remove());

            if (elements.pauseDialog) {
                elements.pauseDialog.style.cssText = '';
                elements.pauseDialog.classList.remove('pause-minimized');
            }

            updateScore();
            updateLevel();
            updateTimeLeft();
            elements.timeProgress.style.width = '100%';
            if (gameState.timer) clearInterval(gameState.timer);
        }

        function restartGame() {
            elements.gameOver.classList.add('hidden');
            elements.clearScreen.classList.add('hidden');
            elements.pauseScreen.classList.add('hidden');
            elements.gameArea.classList.remove('hidden');
            audioManager.playStartSound();
            resetGameState();
            generateLevel();
            startTimer();
        }

        function pauseGame() {
            if (gameState.isGameOver) return;
            if (!gameState.isLevelSelectPause) {
                audioManager.playPauseSound();
            }
            gameState.isPaused = true;
            clearInterval(gameState.timer);
            elements.pauseScreen.classList.remove('hidden');
            elements.pauseDialog.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 28rem;
                padding: 2rem;
                z-index: 100;
                border-radius: 1rem;
            `;
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    elements.pauseDialog.classList.add('pause-minimized');
                });
            });
        }

        function resumeGame() {
            audioManager.playClickSound();
            elements.pauseDialog.style.cssText = '';
            elements.pauseDialog.classList.remove('pause-minimized');
            const h2 = elements.pauseDialog.querySelector('h2');
            const buttons = elements.pauseDialog.querySelectorAll('button');
            if (h2) {
                h2.classList.remove('text-lg', 'mb-4');
                h2.classList.add('text-2xl', 'mb-6');
            }
            buttons.forEach(btn => {
                btn.classList.remove('py-2', 'px-4', 'text-sm');
                btn.classList.add('py-3', 'px-8');
            });
            gameState.isPaused = false;
            elements.pauseScreen.classList.add('hidden');
            startTimer();
        }

        function quitGame() {
            audioManager.playClickSound();
            if (elements.pauseDialog) {
                elements.pauseDialog.style.cssText = '';
                elements.pauseDialog.classList.remove('pause-minimized');
                const h2 = elements.pauseDialog.querySelector('h2');
                const buttons = elements.pauseDialog.querySelectorAll('button');
                if (h2) {
                    h2.classList.remove('text-lg', 'mb-4');
                    h2.classList.add('text-2xl', 'mb-6');
                }
                buttons.forEach(btn => {
                    btn.classList.remove('py-2', 'px-4', 'text-sm');
                    btn.classList.add('py-3', 'px-8');
                });
            }
            elements.pauseScreen.classList.add('hidden');
            elements.clearScreen.classList.add('hidden');
            elements.gameArea.classList.add('hidden');
            elements.startScreen.classList.remove('hidden');
            clearInterval(gameState.timer);
        }

        // ================================================================
        //  关卡生成
        // ================================================================

        function generateLevel() {
            elements.bubbleContainer.innerHTML = '';
            gameState.bubbles = [];
            gameState.matchedPairs = 0;

            const pairCount = getPairCountForLevel(gameState.level);
            gameState.totalPairs = pairCount;

            if (pairCount === 0 || gameState.currentWordIndex >= totalWords) {
                clearGame();
                return;
            }

            const words = wordLibrary.all.slice(gameState.currentWordIndex, gameState.currentWordIndex + pairCount);
            if (words.length < pairCount) {
                clearGame();
                return;
            }

            for (let i = gameState.currentWordIndex; i < gameState.currentWordIndex + pairCount; i++) {
                gameState.previousWords.all.push(i);
            }

            const allBubbles = [];

            words.forEach((wordPair, index) => {
                const englishHue = 180 + Math.floor(Math.random() * 40);
                const englishSaturation = 60 + Math.floor(Math.random() * 20);
                const englishLightness = 65 + Math.floor(Math.random() * 10);
                const englishColor = `hsl(${englishHue}, ${englishSaturation}%, ${englishLightness}%)`;

                let chineseHue;
                if (Math.random() > 0.5) {
                    chineseHue = 20 + Math.floor(Math.random() * 40);
                } else {
                    chineseHue = 320 + Math.floor(Math.random() * 40);
                }
                const chineseSaturation = 60 + Math.floor(Math.random() * 20);
                const chineseLightness = 65 + Math.floor(Math.random() * 10);
                const chineseColor = `hsl(${chineseHue}, ${chineseSaturation}%, ${chineseLightness}%)`;

                const pairId = gameState.currentWordIndex + index;

                allBubbles.push({
                    id: `bubble-english-${pairId}`,
                    type: 'english',
                    content: wordPair.english,
                    phonetic: wordPair.phonetic || '',
                    pairId: pairId,
                    matched: false,
                    color: englishColor
                });

                allBubbles.push({
                    id: `bubble-chinese-${pairId}`,
                    type: 'chinese',
                    content: wordPair.chinese,
                    pairId: pairId,
                    matched: false,
                    color: chineseColor
                });
            });

            shuffleArray(allBubbles);
            gameState.bubbles = allBubbles;

            allBubbles.forEach((bubble, index) => {
                const bubbleElement = createBubbleElement(bubble);
                setTimeout(() => {
                    elements.bubbleContainer.appendChild(bubbleElement);
                }, index * 50);
            });
        }

        function createBubbleElement(bubble) {
            const bubbleDiv = document.createElement('div');
            bubbleDiv.id = bubble.id;
            bubbleDiv.className = `animate-pop-in bubble`;
            bubbleDiv.dataset.type = bubble.type;
            bubbleDiv.dataset.pairId = bubble.pairId;
            bubbleDiv.dataset.content = bubble.content;
            bubbleDiv.style.backgroundColor = bubble.color;
            bubbleDiv.style.color = 'white';
            bubbleDiv.style.textShadow = '1px 1px 2px rgba(0,0,0,0.5)';
            bubbleDiv.style.fontWeight = 'bold';
            bubbleDiv.style.boxShadow = `0 5px 15px rgba(0, 0, 0, 0.15), inset 0 -2px 4px -1px rgba(0, 0, 0, 0.1)`;

            if (bubble.type === 'english') {
                bubbleDiv.innerHTML = `
                    <span>${bubble.content}</span>
                    ${bubble.phonetic ? `<span class="phonetic">${bubble.phonetic}</span>` : ''}
                `;
            } else {
                bubbleDiv.textContent = bubble.content;
            }

            bubbleDiv.addEventListener('click', () => selectBubble(bubbleDiv));
            return bubbleDiv;
        }

        // ================================================================
        //  匹配逻辑（含答对加时规则：第5关起+1秒）
        // ================================================================

        function selectBubble(bubbleElement) {
            if (gameState.isPaused || gameState.isGameOver ||
                bubbleElement.classList.contains('matched') ||
                (gameState.selectedBubble && gameState.selectedBubble.id === bubbleElement.id)) {
                return;
            }

            speechManager.playBubbleSpeech(bubbleElement);

            if (gameState.selectedBubble && gameState.selectedBubble.dataset.type === bubbleElement.dataset.type) {
                gameState.selectedBubble.classList.remove('bubble-selected');
            }

            bubbleElement.classList.add('bubble-selected');
            gameState.selectedBubble = bubbleElement;

            const selectedBubbles = document.querySelectorAll('.bubble-selected');
            if (selectedBubbles.length === 2) {
                checkForMatch();
            }
        }

        function checkForMatch() {
            const selectedBubbles = document.querySelectorAll('.bubble-selected');
            if (selectedBubbles.length !== 2) return;

            const [bubble1, bubble2] = selectedBubbles;

            const isDifferentTypes = bubble1.dataset.type !== bubble2.dataset.type;
            const isSamePair = bubble1.dataset.pairId === bubble2.dataset.pairId;

            if (isDifferentTypes && isSamePair) {
                audioManager.playCorrectSound();

                const rect1 = bubble1.getBoundingClientRect();
                const containerRect = elements.bubbleContainer.getBoundingClientRect();
                const x1 = rect1.left - containerRect.left + rect1.width / 2;
                const y1 = rect1.top - containerRect.top + rect1.height / 2;

                const rect2 = bubble2.getBoundingClientRect();
                const x2 = rect2.left - containerRect.left + rect2.width / 2;
                const y2 = rect2.top - containerRect.top + rect2.height / 2;

                createConfetti(x1, y1, bubble1.style.backgroundColor);
                createConfetti(x2, y2, bubble2.style.backgroundColor);

                bubble1.classList.add('bubble-matched', 'matched');
                bubble2.classList.add('bubble-matched', 'matched');

                const basePoints = 10;
                const timeBonus = Math.floor(gameState.timeLeft / 5);
                gameState.score += basePoints + timeBonus;
                updateScore();

                // ========== 第5关起答对加1秒 ==========
                if (gameState.level >= 5) {
                    gameState.timeLeft += 1;
                    updateTimeLeft();
                    const totalTime = getTimeForLevel(gameState.level);
                    let percent = Math.min((gameState.timeLeft / totalTime) * 100, 100);
                    elements.timeProgress.style.width = `${percent}%`;
                }

                gameState.matchedPairs++;

                bubble1.classList.remove('bubble-selected');
                bubble2.classList.remove('bubble-selected');

                if (gameState.matchedPairs === gameState.totalPairs) {
                    const nextStart = gameState.currentWordIndex + getPairCountForLevel(gameState.level);
                    if (nextStart >= totalWords) {
                        clearGame();
                    } else {
                        nextLevel();
                    }
                }
            } else {
                audioManager.playWrongSound();

                bubble1.classList.add('bubble-error');
                bubble2.classList.add('bubble-error');

                gameState.score = Math.max(0, gameState.score - 2);
                updateScore();

                setTimeout(() => {
                    bubble1.classList.remove('bubble-selected', 'bubble-error');
                    bubble2.classList.remove('bubble-selected', 'bubble-error');
                }, 500);
            }

            gameState.selectedBubble = null;
        }

        function nextLevel() {
            audioManager.playLevelUpSound();
            clearInterval(gameState.timer);

            // 更新解锁状态：解锁下一关（当前关+1）
            const nextLevel = gameState.level + 1;
            if (nextLevel <= gameState.totalLevels) {
                gameState.unlockedLevel = Math.max(gameState.unlockedLevel, nextLevel);
            }

            gameState.currentWordIndex += getPairCountForLevel(gameState.level);
            gameState.level++;
            gameState.timeLeft = getTimeForLevel(gameState.level);
            updateLevel();
            updateTimeLeft();
            elements.timeProgress.style.width = '100%';
            setTimeout(() => {
                generateLevel();
                startTimer();
            }, 1000);
        }

        // ================================================================
        //  通关及稀有特效
        // ================================================================

        function clearGame() {
            clearInterval(gameState.timer);
            gameState.isGameOver = true;
            gameState.isCleared = true;
            audioManager.playClearSound();
            elements.clearScoreDisplay.textContent = gameState.score;
            elements.clearLevelDisplay.textContent = gameState.level;
            elements.gameArea.classList.add('hidden');
            elements.clearScreen.classList.remove('hidden');
            startFireworks();

            // 30% 概率触发稀有卡牌特效
            if (Math.random() < 0.3) {
                showRareCard();
            }
        }

        // ----- 显示卡牌浮层（带关闭按钮，宽400px高550px，居中） -----
        function showRareCard() {
            let cardImage;
            if (presetCardImages.length > 0) {
                const idx = Math.floor(Math.random() * presetCardImages.length);
                cardImage = presetCardImages[idx];
            } else {
                // 生成示例卡牌
                const canvas = document.createElement('canvas');
                canvas.width = 300;
                canvas.height = 420;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createLinearGradient(0, 0, 300, 420);
                grad.addColorStop(0, '#f7e05e');
                grad.addColorStop(1, '#d4a017');
                ctx.fillStyle = grad;
                ctx.shadowColor = 'rgba(255,215,0,0.8)';
                ctx.shadowBlur = 20;
                ctx.fillRect(0, 0, 300, 420);
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white';
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 10;
                ctx.fillRect(15, 15, 270, 390);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#FFD700';
                ctx.shadowColor = '#FFD700';
                ctx.shadowBlur = 20;
                const cx = 150, cy = 180, r = 50;
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 4 * Math.PI / 5) - Math.PI/2;
                    const x = cx + r * Math.cos(angle);
                    const y = cy + r * Math.sin(angle);
                    ctx.beginPath();
                    ctx.arc(x, y, 10, 0, 2 * Math.PI);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#333';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('CARD', 150, 300);
                cardImage = canvas.toDataURL('image/png');
            }

            const overlay = document.createElement('div');
            overlay.id = 'rare-card-overlay';
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.4);
                z-index: 2000;
                display: flex;
                align-items: center;
                justify-content: center;
                pointer-events: auto;
                backdrop-filter: blur(4px);
            `;

            const cardWrapper = document.createElement('div');
            cardWrapper.style.cssText = `
                animation: cardAppear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
                position: relative;
                width: 400px;
                height: 550px;
            `;

            cardWrapper.innerHTML = `
                <div style="
                    width: 100%;
                    height: 100%;
                    background: linear-gradient(145deg, #f7e05e, #d4a017);
                    border-radius: 20px;
                    box-shadow: 0 0 40px rgba(255, 215, 0, 0.9), inset 0 0 30px rgba(255, 215, 0, 0.4);
                    padding: 12px;
                    box-sizing: border-box;
                ">
                    <div style="
                        width: 100%;
                        height: 100%;
                        background: white;
                        border-radius: 12px;
                        overflow: hidden;
                        background-image: url(${cardImage});
                        background-size: cover;
                        background-position: center;
                        box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
                    "></div>
                </div>
                <button id="close-card-btn" style="
                    position: absolute;
                    top: -20px;
                    right: -20px;
                    width: 48px;
                    height: 48px;
                    border-radius: 50%;
                    background: #ff4757;
                    color: white;
                    border: 3px solid white;
                    font-size: 22px;
                    font-weight: bold;
                    cursor: pointer;
                    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                    transition: 0.2s;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    line-height: 1;
                ">✕</button>
            `;

            overlay.appendChild(cardWrapper);
            document.body.appendChild(overlay);

            document.getElementById('close-card-btn').addEventListener('click', function() {
                overlay.remove();
            });

            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    overlay.remove();
                }
            });
        }

        // ================================================================
        //  计时器
        // ================================================================

        function startTimer() {
            if (gameState.timer) clearInterval(gameState.timer);

            gameState.timer = setInterval(() => {
                if (gameState.timeLeft > 0) {
                    gameState.timeLeft--;
                    updateTimeLeft();
                    const totalTime = getTimeForLevel(gameState.level);
                    let percent = Math.min((gameState.timeLeft / totalTime) * 100, 100);
                    elements.timeProgress.style.width = `${percent}%`;

                    if (gameState.timeLeft <= Math.floor(totalTime * 0.35)) {
                        elements.timeLeftDisplay.classList.add('text-red-500', 'animate-pulse');
                    } else {
                        elements.timeLeftDisplay.classList.remove('text-red-500', 'animate-pulse');
                    }
                } else {
                    audioManager.playGameOverSound();
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            clearInterval(gameState.timer);
            gameState.isGameOver = true;
            elements.finalScoreDisplay.textContent = gameState.score;
            elements.finalLevelDisplay.textContent = `已完成: 第${gameState.level}关`;
            elements.gameArea.classList.add('hidden');
            elements.gameOver.classList.remove('hidden');
        }

        // ================================================================
        //  UI 更新
        // ================================================================

        function updateScore() {
            elements.scoreDisplay.textContent = gameState.score;
            elements.scoreDisplay.classList.add('scale-125', 'text-accent');
            setTimeout(() => {
                elements.scoreDisplay.classList.remove('scale-125', 'text-accent');
            }, 300);
        }

        function updateLevel() {
            elements.levelDisplay.textContent = gameState.level;
            elements.levelDisplay.classList.add('scale-125', 'text-accent');
            setTimeout(() => {
                elements.levelDisplay.classList.remove('scale-125', 'text-accent');
            }, 300);
        }

        function updateTimeLeft() {
            elements.timeLeftDisplay.textContent = gameState.timeLeft;
        }

        // ================================================================
        //  工具函数
        // ================================================================

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createConfetti(x, y, color) {
            const container = elements.bubbleContainer;
            const count = 8;
            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                const size = 4 + Math.random() * 6;
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                confetti.style.backgroundColor = color;
                confetti.style.left = `${x}px`;
                confetti.style.top = `${y}px`;
                const angle = (i / count) * 360;
                const distance = 15 + Math.random() * 15;
                const translateX = Math.cos(angle * Math.PI / 180) * distance;
                const translateY = Math.sin(angle * Math.PI / 180) * distance;
                confetti.style.animation = `fadeOut 0.6s ease-out forwards`;
                confetti.style.transform = `translate(${translateX}px, ${translateY}px)`;
                container.appendChild(confetti);
                setTimeout(() => {
                    if (confetti.parentNode) confetti.parentNode.removeChild(confetti);
                }, 600);
            }
        }

        // ================================================================
        //  烟花特效
        // ================================================================

        function startFireworks() {
            if (gameState.fireworkInterval) return;
            const container = document.getElementById('clear-screen');
            const colors = ['#FF5252', '#FF4081', '#E040FB', '#7C4DFF', '#536DFE', '#448AFF', '#40C4FF', '#18FFFF', '#64FFDA',
                '#69F0AE', '#B2FF59', '#EEFF41', '#FFFF00', '#FFD740', '#FFAB40', '#FF6E40'
            ];

            gameState.fireworkInterval = setInterval(() => {
                const startX = Math.random() * window.innerWidth;
                const startY = window.innerHeight;
                const targetX = Math.random() * window.innerWidth;
                const targetY = Math.random() * (window.innerHeight / 2);
                const color = colors[Math.floor(Math.random() * colors.length)];

                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.left = `${startX}px`;
                firework.style.top = `${startY}px`;
                firework.style.backgroundColor = color;
                firework.style.boxShadow = `0 0 5px ${color}`;
                container.appendChild(firework);

                let progress = 0;
                const duration = 1000;
                const startTime = Date.now();

                const moveFirework = () => {
                    const elapsed = Date.now() - startTime;
                    progress = Math.min(elapsed / duration, 1);
                    const currentX = startX + (targetX - startX) * progress;
                    const currentY = startY + (targetY - startY) * progress * progress;
                    firework.style.left = `${currentX}px`;
                    firework.style.top = `${currentY}px`;

                    const trail = document.createElement('div');
                    trail.className = 'firework-trail';
                    trail.style.left = `${currentX}px`;
                    trail.style.top = `${currentY}px`;
                    trail.style.backgroundColor = color;
                    trail.style.opacity = 0.8 - progress * 0.8;
                    container.appendChild(trail);
                    setTimeout(() => {
                        if (trail.parentNode) trail.parentNode.removeChild(trail);
                    }, 200);

                    if (progress < 1) {
                        requestAnimationFrame(moveFirework);
                    } else {
                        explodeFirework(targetX, targetY, color);
                        if (firework.parentNode) firework.parentNode.removeChild(firework);
                    }
                };
                moveFirework();
            }, 300);
        }

        function explodeFirework(x, y, color) {
            const container = document.getElementById('clear-screen');
            const particleCount = 50;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework';
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                particle.style.backgroundColor = color;
                particle.style.boxShadow = `0 0 5px ${color}`;
                particle.style.opacity = '1';
                container.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 4;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                let progress = 0;
                const duration = 1500;
                const startTime = Date.now();

                const animateParticle = () => {
                    const elapsed = Date.now() - startTime;
                    progress = Math.min(elapsed / duration, 1);
                    const currentX = x + vx * progress * 100;
                    const currentY = y + vy * progress * 100 - 0.5 * 0.5 * progress * progress * 200;
                    particle.style.left = `${currentX}px`;
                    particle.style.top = `${currentY}px`;
                    particle.style.opacity = 1 - progress;
                    if (progress < 1) {
                        requestAnimationFrame(animateParticle);
                    } else {
                        if (particle.parentNode) particle.parentNode.removeChild(particle);
                    }
                };
                animateParticle();
            }
        }

        // ================================================================
        //  初始化
        // ================================================================

        window.addEventListener('load', function() {
            if ('speechSynthesis' in window) {
                speechSynthesis.getVoices();
                if (speechSynthesis.getVoices().length === 0) {
                    speechSynthesis.addEventListener('voiceschanged', function() {
                        console.log('语音引擎加载完成');
                    });
                }
            }
            audioManager.init();
            gameState.totalLevels = TOTAL_LEVELS;
            if (gameState.level > gameState.totalLevels) {
                gameState.level = 1;
            }
            // 初始解锁第1关
            gameState.unlockedLevel = 1;
            updateLevel();
            console.log(`📚 词库 ${totalWords} 个词条，每关词数：${levelWordCounts.join(', ')}，共 ${TOTAL_LEVELS} 关`);
            console.log('💡 提示：从第5关起，每答对一组额外增加1秒');
            console.log('🎴 第11关单独设为 35 秒，通关后有 30% 概率触发卡牌特效');
            console.log('🔒 选关限制：只能选择已解锁的关卡（逐关解锁）');
        });
    </script>
</body>
</html>
